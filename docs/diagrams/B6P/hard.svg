t class="lbl" x="683.1" y="280" text-anchor="start">→ 손끝판 항상 수직 (평행 집기)</text><polyline class="lead" points="305.9,197.8 462.3,319.7"/><circle class="dot" cx="462.3" cy="319.7" r="2"/><text class="lbl" x="305.9" y="201.8" text-anchor="end">매듭: 안쪽 링크, 윗 접는 선에서 70</text><polyline class="lead" points="683.1,349.6 515.2,368.87"/><circle class="dot" cx="515.2" cy="368.87" r="2"/><text class="lbl" x="683.1" y="353.6" text-anchor="start">건전지 집기: 링크 수직</text><polyline class="lead" points="305.9,331.2 473.8,371.17"/><circle class="dot" cx="473.8" cy="371.17" r="2"/><text class="lbl" x="305.9" y="335.2" text-anchor="end">손톱 14 mm (3겹): 바닥에 눌리면 접힘</text><text class="note" x="6.9" y="400.2" text-anchor="start">측면 단면 (y–z), 점선 = 열림 54° · 단위 mm</text></svg>