고무줄 구멍 Ø3 (x=±16, y=-13)</text><polyline class="lead" points="9,330 489,225"/><circle class="dot" cx="489" cy="225" r="2"/><text class="lbl" x="9" y="334" text-anchor="start">팔 장착 24×30 (가운데)</text><polyline class="lead" points="1041,330 615,249"/><circle class="dot" cx="615" cy="249" r="2"/><text class="lbl" x="1041" y="334" text-anchor="end">파란 점선 = 접는 선 (x=±30)</text><text class="note" x="525" y="9" text-anchor="middle">위에서 본 손바닥 윗장 (펼친 상태) · 앞 = +y · 단위 mm</text></svg>