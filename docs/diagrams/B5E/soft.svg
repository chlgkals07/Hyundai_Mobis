<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 424" role="img" aria-label="soft 정면 단면"><style>
.board{fill:#d8b48a;stroke:#6b4a2a;stroke-width:1.2}
.board2{fill:#c9a274;stroke:#6b4a2a;stroke-width:1.2}
.ghost{fill:none;stroke:#8a7a68;stroke-width:1;stroke-dasharray:5 4}
.flank{fill:#f3dfbd;stroke:#9a7a4a;stroke-width:1.2}
.flankg{fill:none;stroke:#b09a7a;stroke-width:1;stroke-dasharray:5 4}
.drum{fill:#a87a4c;stroke:#5a3d22;stroke-width:1.2}
.groove{fill:none;stroke:#3d2714;stroke-width:1;stroke-dasharray:3 3}
.straw{fill:#f7f5f0;stroke:#888;stroke-width:1}
.string{fill:none;stroke:#1b3a6b;stroke-width:2.2}
.tendon{fill:none;stroke:#7d3c98;stroke-width:2.4}
.rubber{fill:none;stroke:#e4572e;stroke-width:2}
.stop{fill:#4f7d6c;stroke:#244a3d;stroke-width:1.2}
.nail{fill:#8a6a45;stroke:#4a3520;stroke-width:1.2}
.pad{fill:#333}
.obj{fill:#8f9cad;stroke:#4d5866;stroke-width:1.2}
.floor{stroke:#2f6b5b;stroke-width:3}
.pivot{fill:#fff;stroke:#222;stroke-width:1.5}
.lead{fill:none;stroke:#555;stroke-width:.8}
.dot{fill:#555}
.glue{fill:url(#hatch);stroke:none}
text{font-family:"IBM Plex Sans KR","WenQuanYi Zen Hei","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.lbl{font-size:12.5px;fill:#1d2422}
.note{font-size:11px;fill:#5b6763}
.hd{font-size:15px;font-weight:700;fill:#1d2422}
.dim{font-size:11px;fill:#244a3d;font-family:"IBM Plex Mono",monospace}
</style><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" stroke="#e08a00" stroke-width="1.6"/></pattern></defs><polygon class="board" points="410,194 530,194 530,188 410,188"/><polygon class="board2" points="413,200 527,200 527,194 413,194"/><polygon class="flankg" points="546,215.71 631,362.94 594.5,187.71"/><polyline class="flankg" points="530,188 546,215.71"/><polygon class="ghost" points="526.87,195.36 479.01,175.05 485.26,160.32 533.13,180.64"/><polygon class="board" points="530,188 525.56,219.69 531.51,220.52 535.94,188.83"/><polygon class="flank" points="525.56,219.69 502,388.05 581.02,227.45"/><polyline class="straw" points="520.85,253.36 565.22,259.57"/><polyline class="straw" points="516.14,287.03 549.41,291.69"/><polyline class="straw" points="511.43,320.71 533.61,323.81"/><polyline class="straw" points="506.71,354.38 517.8,355.93"/><polygon class="drum" points="551.79,191.05 547.35,222.74 531.51,220.52 535.94,188.83"/><polygon class="drum" points="523.01,191.88 497.77,146.42 511.76,138.65 536.99,184.12"/><circle class="pivot" cx="504.76" cy="142.53" r="2.4"/><polyline class="string" points="504.76,142.53 528,78"/><polyline class="rubber" points="533.23,211.07 526.56,208.96 524.29,201.15 516.15,200.94 513.88,193.12 505.74,192.91 502,187"/><polygon class="stop" points="514.08,216 526.08,216 526.08,200 514.08,200"/><polygon class="flankg" points="394,215.71 309,362.94 345.5,187.71"/><polyline class="flankg" points="410,188 394,215.71"/><polygon class="ghost" points="406.87,180.64 454.74,160.32 460.99,175.05 413.13,195.36"/><polygon class="board" points="410,188 414.44,219.69 408.49,220.52 404.06,188.83"/><polygon class="flank" points="414.44,219.69 438,388.05 358.98,227.45"/><polyline class="straw" points="419.15,253.36 374.78,259.57"/><polyline class="straw" points="423.86,287.03 390.59,291.69"/><polyline class="straw" points="428.57,320.71 406.39,323.81"/><polyline class="straw" points="433.29,354.38 422.2,355.93"/><polygon class="drum" points="404.06,188.83 408.49,220.52 392.65,222.74 388.21,191.05"/><polygon class="drum" points="403.01,184.12 428.24,138.65 442.23,146.42 416.99,191.88"/><circle class="pivot" cx="435.24" cy="142.53" r="2.4"/><polyline class="string" points="435.24,142.53 412,78"/><polyline class="rubber" points="406.77,211.07 410.51,205.16 418.64,204.95 420.92,197.13 429.05,196.92 431.33,189.11 438,187"/><polygon class="stop" points="425.92,216 413.92,216 413.92,200 425.92,200"/><polygon class="board" points="404,78 536,78 536,72 404,72"/><polyline class="rubber" points="470,72 466,68 474,64 466,60 474,56 466,52 474,48 466,44 470,40"/><polyline class="string" points="470,40 470,16"/><text class="lbl" x="470" y="12" text-anchor="middle">손잡이 (실 A)</text><polyline class="lead" points="234,24 470,24"/><circle class="dot" cx="470" cy="24" r="2"/><text class="lbl" x="234" y="28" text-anchor="end">실 A 를 위로 당기면 플랩이 닫힘</text><polyline class="lead" points="234,56 470,56"/><circle class="dot" cx="470" cy="56" r="2"/><text class="lbl" x="234" y="60" text-anchor="end">직렬 고무줄 = 힘 제한 (0.5 N/Fin Ray)</text><polyline class="lead" points="706,76 536,75"/><circle class="dot" cx="536" cy="75" r="2"/><text class="lbl" x="706" y="80" text-anchor="start">균형막대: 먼저 닿은 쪽은 멈추고 반대쪽이 계속</text><polyline class="lead" points="706,116 508.76,142.53"/><circle class="dot" cx="508.76" cy="142.53" r="2"/><text class="lbl" x="706" y="120" text-anchor="start">레버 r26 (2겹 V자): 팔 끝 구멍에 실 A 매듭</text><polyline class="lead" points="706,144 542,200"/><circle class="dot" cx="542" cy="200" r="2"/><text class="lbl" x="706" y="148" text-anchor="start">레버 발은 플랩 바깥면에 세워 풀칠 + 삼각 보강</text><polyline class="lead" points="706,180 502,180"/><circle class="dot" cx="502" cy="180" r="2"/><text class="lbl" x="706" y="184" text-anchor="start">점선 = 열림 30° · 레버가 손바닥에 닿는 35.08° 가 열림 스토퍼</text><polyline class="lead" points="234,180 414,197"/><circle class="dot" cx="414" cy="197" r="2"/><text class="lbl" x="234" y="184" text-anchor="end">아랫장 좌우 1.5 mm 좁게 (−8° 접힐 공간)</text><polyline class="lead" points="234,224 419.92,208"/><circle class="dot" cx="419.92" cy="208" r="2"/><text class="lbl" x="234" y="228" text-anchor="end">닫힘 스토퍼 블록 (-7.97° 에서 멈춤)</text><polyline class="lead" points="706,280 546,300"/><circle class="dot" cx="546" cy="300" r="2"/><text class="lbl" x="706" y="284" text-anchor="start">Fin Ray: 단면 골판지 띠 + 빨대 리브</text><polyline class="lead" points="706,316 534,360"/><circle class="dot" cx="534" cy="360" r="2"/><text class="lbl" x="706" y="320" text-anchor="start">물체에 닿으면 끝이 물체 쪽으로 감쌈</text><polyline class="lead" points="234,280 422,194"/><circle class="dot" cx="422" cy="194" r="2"/><text class="lbl" x="234" y="284" text-anchor="end">복원 고무줄: 실을 놓으면 펼쳐짐</text><text class="note" x="6" y="416" text-anchor="start">정면 단면 (x–z) · 실선 = 닫힘(−8°), 점선 = 열림(30°) · 단위 mm</text></svg>