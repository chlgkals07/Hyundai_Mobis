s="lead" points="1041,24 568.5,43.5"/><circle class="dot" cx="568.5" cy="43.5" r="2"/><text class="lbl" x="1041" y="28" text-anchor="end">브래킷 끝이 손바닥보다 1.5 mm 나옴 (괜찮음)</text><polyline class="lead" points="1041,222 600.12,210"/><circle class="dot" cx="600.12" cy="210" r="2"/><text class="lbl" x="1041" y="226" text-anchor="end">soft 닫힘 스토퍼 블록 (6×20, 높이 8): 바깥 면 x=±28.04, y=−20…0</text><polyline class="lead" points="9,300 472.5,220.5"/><circle class="dot" cx="472.5" cy="220.5" r="2"/><text class="lbl" x="9" y="304" text-anchor="start">작은 사각 = 브래킷 삼각 보강 (바깥 면, 안쪽 축 옆)</text><polyline class="lead" points="1041,300 610.5,270"/><circle class="dot" cx="610.5" cy="270" r="2"/><text class="lbl" x="1041" y="304" text-anchor="end">아랫장은 윗장보다 좌우 1.5 mm 좁음 (폭 57)</text><text class="note" x="525" y="9" text-anchor="middle">아랫면에 붙는 것 (위에서 투시) · 앞 = +y · 단위 mm</text></svg>