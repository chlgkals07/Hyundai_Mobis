<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1050 360" role="img" aria-label="손바닥 윗면 지도"><style>
.dg .board{fill:#d8b48a;stroke:#6b4a2a;stroke-width:1.2}
.dg .board2{fill:#c9a274;stroke:#6b4a2a;stroke-width:1.2}
.dg .ghost{fill:none;stroke:#8a7a68;stroke-width:1;stroke-dasharray:5 4}
.dg .flank{fill:#f3dfbd;stroke:#9a7a4a;stroke-width:1.2}
.dg .flankg{fill:none;stroke:#b09a7a;stroke-width:1;stroke-dasharray:5 4}
.dg .drum{fill:#a87a4c;stroke:#5a3d22;stroke-width:1.2}
.dg .groove{fill:none;stroke:#3d2714;stroke-width:1;stroke-dasharray:3 3}
.dg .straw{fill:#f7f5f0;stroke:#888;stroke-width:1}
.dg .string{fill:none;stroke:#1b3a6b;stroke-width:2.2}
.dg .tendon{fill:none;stroke:#7d3c98;stroke-width:2.4}
.dg .rubber{fill:none;stroke:#e4572e;stroke-width:2}
.dg .stop{fill:#4f7d6c;stroke:#244a3d;stroke-width:1.2}
.dg .nail{fill:#8a6a45;stroke:#4a3520;stroke-width:1.2}
.dg .pad{fill:#333}
.dg .obj{fill:#8f9cad;stroke:#4d5866;stroke-width:1.2}
.dg .floor{stroke:#2f6b5b;stroke-width:3}
.dg .pivot{fill:#fff;stroke:#222;stroke-width:1.5}
.dg .lead{fill:none;stroke:#555;stroke-width:.8}
.dg .dot{fill:#555}
.dg .glue{fill:url(#hatch);stroke:none}
.dg text{font-family:"IBM Plex Sans KR","WenQuanYi Zen Hei","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.dg .lbl{font-size:12.5px;fill:#1d2422}
.dg .note{font-size:11px;fill:#5b6763}
.dg .hd{font-size:15px;font-weight:700;fill:#1d2422}
.dg .dim{font-size:11px;fill:#244a3d;font-family:"IBM Plex Mono",monospace}
</style><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" stroke="#e08a00" stroke-width="1.6"/></pattern></defs><polygon class="board" points="435,312 615,312 615,48 435,48"/><polygon class="board2" points="615,258 663,258 663,66 615,66"/><polygon class="board2" points="435,258 387,258 387,66 435,66"/><polyline class="groove" points="615,258 615,66"/><polyline class="groove" points="435,258 435,66"/><polygon class="stop" points="576,96 615,96 615,66 576,66"/><polygon class="stop" points="474,96 435,96 435,66 474,66"/><polygon class="ghost" points="543.2,90 663,90 663,72 543.2,72"/><circle class="pivot" cx="543.2" cy="81" r="4.2"/><polygon class="ghost" points="506.8,90 387,90 387,72 506.8,72"/><circle class="pivot" cx="506.8" cy="81" r="4.2"/><polygon class="flank" points="654,174 663,174 663,108 654,108"/><polygon class="flank" points="654,252 663,252 663,186 654,186"/><polygon class="flank" points="396,174 387,174 387,108 396,108"/><polygon class="flank" points="396,252 387,252 387,186 396,186"/><circle class="pivot" cx="573" cy="219" r="4.5"/><circle class="pivot" cx="477" cy="219" r="4.5"/><circle class="pivot" cx="525" cy="94.5" r="4.5"/><circle class="ghost" cx="525" cy="115.5" r="4.5"/><circle class="pivot" cx="525" cy="265.5" r="4.5"/><circle class="ghost" cx="525" cy="244.5" r="4.5"/><polygon class="ghost" points="489,225 561,225 561,135 489,135"/><polyline class="lead" points="9,24 525,94.5"/><circle class="dot" cx="525" cy="94.5" r="2"/><text class="lbl" x="9" y="28" text-anchor="start">텐던 구멍 Ø3 (x=0, y=±28.5)</text><polyline class="lead" points="9,60 525,115.5"/><circle class="dot" cx="525" cy="115.5" r="2"/><text class="lbl" x="9" y="64" text-anchor="start">점선 원 = B5N 구멍 (y=±21.5, 같이 뚫어 둠)</text><polyline class="lead" points="1041,24 603,72"/><circle class="dot" cx="603" cy="72" r="2"/><text class="lbl" x="1041" y="28" text-anchor="end">레버 슬롯 13×10 (윗장·아랫장 둘 다)</text><polyline class="lead" points="1041,60 567,81"/><circle class="dot" cx="567" cy="81" r="2"/><text class="lbl" x="1041" y="64" text-anchor="end">점선 = soft 레버 (발은 플랩 위, 팔은 안쪽)</text><polyline class="lead" points="9,276 477,219"/><circle class="dot" cx="477" cy="219" r="2"/><text class="lbl" x="9" y="280" text-anchor="start">고무줄 구멍 Ø3 (x=±16, y=-13)</text><polyline class="lead" points="1041,276 658.5,219"/><circle class="dot" cx="658.5" cy="219" r="2"/><text class="lbl" x="1041" y="280" text-anchor="end">Fin Ray 밑판 자리 (플랩 끝, 2개씩)</text><polyline class="lead" points="9,330 489,225"/><circle class="dot" cx="489" cy="225" r="2"/><text class="lbl" x="9" y="334" text-anchor="start">팔 장착 24×30 (가운데, 여기만 접착)</text><polyline class="lead" points="1041,330 615,249"/><circle class="dot" cx="615" cy="249" r="2"/><text class="lbl" x="1041" y="334" text-anchor="end">파란 점선 = 접는 선 (x=±30), 바깥 16 mm = 플랩</text><text class="note" x="525" y="9" text-anchor="middle">위에서 본 손바닥 윗장 (펼친 상태) · 앞 = +y · 단위 mm</text></svg>