><polyline class="lead" points="683.1,92 603.75,179.4"/><circle class="dot" cx="603.75" cy="179.4" r="2"/><text class="lbl" x="683.1" y="96" text-anchor="start">드럼 r16: 바깥 링크 막대 사이에 면 접착</text><polyline class="lead" points="683.1,124.2 543.95,151.8"/><circle class="dot" cx="543.95" cy="151.8" r="2"/><text class="lbl" x="683.1" y="128.2" text-anchor="start">실은 드럼 안쪽 접선(y=±21.5)에서 위로</text><polyline class="lead" points="683.1,243.8 560.05,262.2"/><circle class="dot" cx="560.05" cy="262.2" r="2"/><text class="lbl" x="683.1" y="247.8" text-anchor="start">평행사변형: 피벗 간격 24 = 핀 간격 24, 링크 55</text><polyline class="lead" points="683.1,276 525.55,315.97"/><circle class="dot" cx="525.55" cy="315.97" r="2"/><text class="lbl" x="683.1" y="280" text-anchor="start">→ 손끝판 항상 수직 (평행 pinch)</text><polyline class="lead" points="683.1,170.2 594.11,192.08"/><circle class="dot" cx="594.11" cy="192.08" r="2"/><text class="lbl" x="683.1" y="174.2" text-anchor="start">열림 54° 스토퍼 탭 (점선 = 열림 자세)</text><polyline class="lead" points="683.1,349.6 515.2,368.87"/><circle class="dot" cx="515.2" cy="368.87" r="2"/><text class="lbl" x="683.1" y="353.6" text-anchor="start">건전지 pinch: 링크 수직 = 손끝 최저점</text><polyline class="lead" points="305.9,331.2 473.8,371.17"/><circle class="dot" cx="473.8" cy="371.17" r="2"/><text class="lbl" x="305.9" y="335.2" text-anchor="end">긴 손톱 14 mm (3겹): 바닥에 눌리면 접힘</text><polyline class="lead" points="305.9,184 397.9,230"/><circle class="dot" cx="397.9" cy="230" r="2"/><text class="lbl" x="305.9" y="188" text-anchor="end">복원 고무줄: 실을 놓으면 바깥으로 열림</text><text class="note" x="6.9" y="400.2" text-anchor="start">측면 단면 (y–z), 손바닥 아래 높이 101.38 mm 에서 건전지 · 단위 mm</text></svg>