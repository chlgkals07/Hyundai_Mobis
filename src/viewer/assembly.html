<title>골판지 그리퍼 조립 과정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 16:9 무대(3D + 전개도 오버레이 + 자막) 아래 재생 컨트롤. 영상 캡처는 무대만 */
:root {
  --bg: #eef1ef; --panel: #f8faf9; --ink: #1d2422; --muted: #5b6763; --line: #d3dad7; --mat: #2f6b5b; --warn: #b7791f;
  --font-ui: "IBM Plex Sans KR", "WenQuanYi Zen Hei", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #131917; --panel: #1a2220; --ink: #e4ebe8; --muted: #93a39d; --line: #2c3834; --mat: #5fb39b; --warn: #e0a84a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #131917; --panel: #1a2220; --ink: #e4ebe8; --muted: #93a39d; --line: #2c3834; --mat: #5fb39b; --warn: #e0a84a; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; display: grid; gap: 10px; }
h1 { font-size: 18px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
/* 무대는 영상과 같은 고정 팔레트 (테마와 무관) */
.stage { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; border-radius: 8px; overflow: hidden; background: #e9ece9; color: #1d2422; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sheet { position: absolute; inset: 3% 28% 3% 28%; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.18); border-radius: 4px; overflow: hidden; }
.sheet svg { width: 100%; height: 100%; display: block; }
.sheet .cut, .sheet .score { transition: none; }
.cap { position: absolute; left: 2.2%; bottom: 3%; max-width: 38%; background: rgba(250,251,250,.94); border-radius: 8px; padding: 1.4% 1.8%; display: grid; gap: .5em; box-shadow: 0 2px 10px rgba(0,0,0,.12); font-size: clamp(10px, 1.45vw, 17px); }
.cap b { font-size: 1.12em; color: #1d2422; }
.cap .craft { color: #2a3330; line-height: 1.45; }
.cap .feas { color: #7a4a00; background: #fbecd2; border-radius: 5px; padding: .25em .55em; line-height: 1.4; }
.cap .lvl { color: #2f6b5b; font-family: var(--font-num); font-size: .85em; letter-spacing: .05em; }
.time { position: absolute; right: 1.5%; top: 2%; font-family: var(--font-num); font-size: clamp(9px, 1vw, 13px); color: #5b6763; background: rgba(250,251,250,.8); padding: 2px 6px; border-radius: 4px; }
.end { position: absolute; inset: 6% 8%; background: rgba(250,251,250,.97); border-radius: 10px; padding: 3% 4%; display: grid; gap: 1.2em; align-content: start; font-size: clamp(10px, 1.35vw, 16px); color: #1d2422; }
.end h2 { margin: 0; font-size: 1.6em; }
.end table { border-collapse: collapse; width: 100%; }
.end td, .end th { border-bottom: 1px solid #d3dad7; padding: .35em .5em; text-align: left; vertical-align: top; }
.end th { color: #5b6763; font-weight: 500; }
.end .ok { color: #2c7a4b; font-weight: 700; }
.end .warn { color: #b7791f; font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.controls button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.controls input[type=range] { flex: 1 1 260px; accent-color: var(--mat); }
.chapters { display: flex; flex-wrap: wrap; gap: 4px; }
.chapters button { font-family: var(--font-num); min-width: 2.2em; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--mat); outline-offset: 2px; }
</style>
<div class="wrap">
  <div><h1>골판지 그리퍼 조립 과정 — B5N</h1><div class="sub">전개도에서 자르고, 접고, 붙이고, 조립해서 동작하기까지 · 시간·난이도는 추정</div></div>
  <div class="stage" id="stage">
    <div class="sheet" id="sheet" hidden></div>
    <div class="cap" id="cap">
      <b id="capTitle"></b>
      <div class="craft" id="capCraft"></div>
      <div class="feas" id="capFeas"></div>
      <div class="lvl" id="capLevel"></div>
    </div>
    <div class="time" id="time"></div>
    <div class="end" id="end" hidden>
      <h2>실현 가능한가? — 네, 하루 작업 분량. 단 3곳이 관건</h2>
      <table><thead><tr><th>단계</th><th>시간 (추정)</th><th>판단</th></tr></thead><tbody id="endRows"></tbody></table>
      <div id="endSum"></div>
    </div>
  </div>
  <div class="controls">
    <button type="button" id="play">재생</button>
    <input type="range" id="scrub" min="0" max="94" step="0.05" value="0" aria-label="시간">
  </div>
  <div class="chapters" id="chapters" aria-label="단계로 이동"></div>
</div>
<!--APP-->
