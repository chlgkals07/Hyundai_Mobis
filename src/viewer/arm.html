<title>팔 결합 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: 왼쪽 조작, 오른쪽 3D. 폰에선 세로로 */
:root { --bg: #eef1ef; --panel: #f8faf9; --ink: #1d2422; --muted: #5b6763; --line: #d3dad7; --mat: #2f6b5b; --bad: #c0392b; --ok: #2c7a4b; --warn: #b7791f;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #131917; --panel: #1a2220; --ink: #e4ebe8; --muted: #93a39d; --line: #2c3834; --mat: #5fb39b; --bad: #f07a6c; --ok: #5cc28a; --warn: #e0a84a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #131917; --panel: #1a2220; --ink: #e4ebe8; --muted: #93a39d; --line: #2c3834; --mat: #5fb39b; --bad: #f07a6c; --ok: #5cc28a; --warn: #e0a84a; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
.wrap { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; display: grid; gap: 12px; }
h1 { font-size: 19px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.warnbox { background: #fbecd2; color: #7a4a00; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
label { display: grid; gap: 2px; font-size: 13px; }
label span { display: flex; justify-content: space-between; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--mat); }
select { font: inherit; padding: 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.stage { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 8px; overflow: hidden; background: #e9ece9; }
.stage canvas { display: block; width: 100%; height: 100%; }
ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
li.bad { color: var(--bad); } li.ok { color: var(--ok); } li.warn { color: var(--warn); }
</style>
<div class="wrap">
  <div><h1>팔 결합 시뮬레이터 — R4 + B5N</h1><div class="sub">params/arm/R4.json 치수로 팔을 만들고 그리퍼를 손목에 매달아 간섭을 확인합니다. 드래그로 회전.</div></div>
  <div class="warnbox">⚠ 팔 치수는 가정값(placeholder)입니다. R4 실측으로 params/arm/R4.json 을 바꾸고 npm run build 하면 이 페이지가 갱신됩니다.</div>
  <div class="grid">
    <div class="box">
      <label for="r"><span>손목 수평 거리 r <b id="rv"></b></span><input id="r" type="range" min="80" max="320" step="5" value="170"></label>
      <label for="lift"><span>손바닥을 Rigid 높이보다 더 올림 (mm)</span><input id="lift" type="range" min="0" max="80" step="1" value="0"></label>
      <label for="yaw"><span>베이스 회전 (°)</span><input id="yaw" type="range" min="-90" max="90" step="1" value="0"></label>
      <label for="roll"><span>wrist roll (°) — 물체 방향 정렬</span><input id="roll" type="range" min="-90" max="90" step="1" value="0"></label>
      <label for="lim"><span>soft 열림 제한 (스토퍼) <b id="lv"></b></span><input id="lim" type="range" min="20" max="90" step="5" value="30"></label>
      <label for="a"><span>실 A (soft 닫기)</span><input id="a" type="range" min="0" max="1" step="0.01" value="0"></label>
      <label for="b"><span>실 B (hard 닫기)</span><input id="b" type="range" min="0" max="1" step="0.01" value="0"></label>
      <label for="obj">물체<select id="obj"><option value="">없음</option><option value="battery">AA 건전지</option></select></label>
      <ul id="out"></ul>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</div>
<!--APP-->
